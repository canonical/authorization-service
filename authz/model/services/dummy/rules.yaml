version: "1"
service: dummy
revision: "2026.07.24.1"
description: |
  Example route protection rules for the federated dummy service.

rules:
  - method: GET
    match: '/api/v1/dummy/{dummy_id}'
    priority: 100
    tuples:
      - user_resource_type: user
        permission: viewer
        object_resource_type: domainAdmin
        object_resource_id: '{dummy_id}'
  - method: POST
    match: '/api/v1/dummy-groups/{group_id}/members'
    priority: 100
    tuples:
      - user_resource_type: user
        permission: member
        object_resource_type: testGroup
        object_resource_id: '{group_id}'
