        object_resource_id: managedSolutions

  - method: POST
    match: '/support/api/staff/**'
    priority: 500
    tuples:
      - user_resource_type: user
        permission: can_access
        object_resource_type: support/feature
        object_resource_id: managedSolutions

  - method: PATCH
    match: '/support/api/staff/**'
    priority: 500
    tuples:
      - user_resource_type: user
        permission: can_access
        object_resource_type: support/feature
        object_resource_id: managedSolutions

  - method: PATCH
    match: '/support/api/staff/coverage-request/{id}/assignee'
    priority: 100
    tuples:
      - user_resource_type: user
        permission: can_administer
        object_resource_type: support/feature
        object_resource_id: managedSolutions

  - method: PATCH
    match: '/support/api/staff/coverage-request/{id}/co-owners'
    priority: 100
    tuples:
      - user_resource_type: user
