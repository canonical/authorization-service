name: CVEs checker

on:
  issues:
    types: [opened]
  schedule:   
     - cron: '0 0 * * 0'

jobs:
  list-all-issues:
    if: ${{ github.event_name == 'schedule' }}
    outputs:
      issues: ${{ steps.issues.outputs.ids }}
    runs-on: ubuntu-latest
    steps:
    - id: list
      run: |
        LIST=$(gh issue list --json number,author -q '.[] | select(.author.login == "ROCKsBot") | .number' | tr '\n' ' ')
        echo "raw_ids=$LIST" >> $GITHUB_OUTPUT
      env:
        GH_PAGER:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
    - id: issues
      run: |
        CLEAN_JSON=$(echo "${{ steps.list.outputs.raw_ids }}" | jq -R 'split(" ") | map(select(length > 0))' -c)
        echo "ids=$CLEAN_JSON" >> $GITHUB_OUTPUT

  scheduled-check:
    permissions:
      contents: write
      issues: write
    needs:
    - list-all-issues
    if: ${{ github.event_name == 'schedule' && needs.list-all-issues.outputs.issues != '[]' && needs.list-all-issues.outputs.issues != '' }}
    strategy:
      matrix:
        issue: ${{ fromJson(needs.list-all-issues.outputs.issues) }}
    uses: canonical/identity-team/.github/workflows/cve-check.yaml@fc85af7448538c473be450dc2c8ec5d158ea0d15 # v1.17.0
    with:
      issue: ${{ matrix.issue }}

  apply-labels:
    permissions:
      contents: write
      issues: write
    if: ${{ github.event.issue.id }}
    uses: canonical/identity-team/.github/workflows/cve-check.yaml@fc85af7448538c473be450dc2c8ec5d158ea0d15 # v1.17.0
