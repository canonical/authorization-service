name: ci
run-name: CI for ${{ github.sha }} on ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "release-**"
    tags:
      - "v**"
  pull_request:
    branches:
      - "*"

jobs:
  openspec-check:
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/openspec-check.yaml
  unit-test:
    uses: ./.github/workflows/unittest.yaml
  e2e-test:
    uses: ./.github/workflows/e2e-test.yaml

  get-architectures:
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.parse.outputs.architectures }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Parse platforms from rockcraft.yaml
        id: parse
        run: |
          archs=$(yq -o=json -I=0 '.platforms | keys' rockcraft.yaml)
          if [ "$archs" = "[]" ] || [ "$archs" = "null" ] || [ -z "$archs" ]; then
            echo "ERROR: no platforms found in rockcraft.yaml" >&2
            exit 1
          fi
          echo "Found architectures: $archs"
          echo "architectures=$archs" >> "$GITHUB_OUTPUT"

  build:
    needs: [ unit-test, get-architectures ]
    strategy:
      matrix:
        architecture: ${{ fromJson(needs.get-architectures.outputs.architectures) }}
    uses: canonical/identity-team/.github/workflows/_rock-build.yaml@6e3d618fb7650a26b7a2254a15fef1d28373bd9d # v1.17.1
    with:
      structure-tests-enabled: true
      architecture: ${{ matrix.architecture }}

  gh-publish-branch:
    permissions:
      packages: write
      contents: read
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [ build, unit-test ]
    uses: canonical/identity-team/.github/workflows/_rock-gh-publish.yaml@6e3d618fb7650a26b7a2254a15fef1d28373bd9d # v1.17.1

  gh-publish-candidate:
    permissions:
      packages: write
      contents: read
    if: ${{ github.ref_type == 'tag' }}
    needs: [ build, unit-test ]
    uses: canonical/identity-team/.github/workflows/_rock-gh-publish.yaml@6e3d618fb7650a26b7a2254a15fef1d28373bd9d # v1.17.1
    with:
      candidate: true

  scan:
    permissions:
      packages: read
      contents: read
      security-events: write
      actions: read
    if: ${{ !cancelled() && (needs.gh-publish-branch.result == 'success' || needs.gh-publish-candidate.result == 'success') }}
    needs: [ gh-publish-branch, gh-publish-candidate ]
    uses: canonical/identity-team/.github/workflows/_rock-scan.yaml@6e3d618fb7650a26b7a2254a15fef1d28373bd9d # v1.17.1
    with:
      image: ${{ needs.gh-publish-candidate.outputs.image || needs.gh-publish-branch.outputs.image }}
      exit-code: '1'
      severity: 'HIGH,CRITICAL'
      ignore-unfixed: true
      trivyignores: '.trivyignore'

  promote:
    permissions:
      packages: write
      contents: write
    if: ${{ github.ref_type == 'tag' }}
    needs: [ gh-publish-candidate, scan ]
    uses: canonical/identity-team/.github/workflows/_rock-promote.yaml@6e3d618fb7650a26b7a2254a15fef1d28373bd9d # v1.17.1
    with:
      candidate-image: ${{ needs.gh-publish-candidate.outputs.image }}
      release-tag: ${{ github.ref_name }}
      promote-stable: true
