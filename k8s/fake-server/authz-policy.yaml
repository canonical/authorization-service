apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: fake-webserver
  namespace: default
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: authorization-service-gateway
  action: CUSTOM
  provider:
    name: "authorization-service"
  rules:
    - to:
      - operation:
          paths: ["/api/*"]
          methods: ["*"]
---
