apiVersion: v1
kind: ConfigMap
metadata:
  name: authorization-service-config
  labels:
    app: authorization-service
data:
  # Server Configuration
  GRPC_PORT: "9090"
  HTTP_PORT: "8080"
  SERVER_HOST: "0.0.0.0"
  
  # Logging
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  
  # Service Dependencies
  OPENFGA_ENABLED: "false"
  OPENFGA_ADDRESS: "openfga.data.svc.cluster.local:8081"
  VALKEY_ENABLED: "false"
  VALKEY_ADDRESS: "valkey-primary.data.svc.cluster.local:6379"
  STS_ADDRESS: "secure-token-service.default.svc.cluster.local:9090"
  STS_ENABLED: "false"

  # External AuthZ & Hydra Configuration
  EXT_AUTHZ_SERVICE_JWK_SET_URL: "http://secure-token-service.default.svc.cluster.local:8080/.well-known/jwks.json"
  EXT_AUTHZ_SERVICE_HYDRA_JWK_SET_URL: "http://hydra.default.svc.cluster.local:4444/.well-known/jwks.json"
  EXT_AUTHZ_SERVICE_HYDRA_ISSUER: "http://hydra.default.svc.cluster.local:4444/"
