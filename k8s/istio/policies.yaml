apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: authorization-service-allow-grpc-mesh
  namespace: default
spec:
  # Target the waypoint gateway for L7 policy enforcement
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: waypoint
  # Allow unauthenticated access to /health
  action: ALLOW
  rules:
  - to:
    - operation:
        paths: ["/envoy.service.auth.v3.Authorization/Check"]
        methods: ["POST"]
---
