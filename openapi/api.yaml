components:
    schemas:
        protobufAny:
            additionalProperties: {}
            description: |-
                `Any` contains an arbitrary serialized protocol buffer message along with a
                URL that describes the type of the serialized message.

                Protobuf library provides support to pack/unpack Any values in the form
                of utility functions or additional generated methods of the Any type.

                Example 1: Pack and unpack a message in C++.

                    Foo foo = ...;
                    Any any;
                    any.PackFrom(foo);
                    ...
                    if (any.UnpackTo(&foo)) {
                      ...
                    }

                Example 2: Pack and unpack a message in Java.

                    Foo foo = ...;
                    Any any = Any.pack(foo);
                    ...
                    if (any.is(Foo.class)) {
                      foo = any.unpack(Foo.class);
                    }
                    // or ...
                    if (any.isSameTypeAs(Foo.getDefaultInstance())) {
                      foo = any.unpack(Foo.getDefaultInstance());
                    }

                 Example 3: Pack and unpack a message in Python.

                    foo = Foo(...)
                    any = Any()
                    any.Pack(foo)
                    ...
                    if any.Is(Foo.DESCRIPTOR):
                      any.Unpack(foo)
                      ...

                 Example 4: Pack and unpack a message in Go

                     foo := &pb.Foo{...}
                     any, err := anypb.New(foo)
                     if err != nil {
                       ...
                     }
                     ...
                     foo := &pb.Foo{}
                     if err := any.UnmarshalTo(foo); err != nil {
                       ...
                     }

                The pack methods provided by protobuf library will by default use
                'type.googleapis.com/full.type.name' as the type URL and the unpack
                methods only use the fully qualified type name after the last '/'
                in the type URL, for example "foo.bar.com/x/y.z" will yield type
                name "y.z".

                JSON
                ====
                The JSON representation of an `Any` value uses the regular
                representation of the deserialized, embedded message, with an
                additional field `@type` which contains the type URL. Example:

                    package google.profile;
                    message Person {
                      string first_name = 1;
                      string last_name = 2;
                    }

                    {
                      "@type": "type.googleapis.com/google.profile.Person",
                      "firstName": <string>,
                      "lastName": <string>
                    }

                If the embedded message type is well-known and has a custom JSON
                representation, that representation will be embedded adding a field
                `value` which holds the custom JSON in addition to the `@type`
                field. Example (for message [google.protobuf.Duration][]):

                    {
                      "@type": "type.googleapis.com/google.protobuf.Duration",
                      "value": "1.212s"
                    }
            properties:
                '@type':
                    description: |-
                        A URL/resource name that uniquely identifies the type of the serialized
                        protocol buffer message. This string must contain at least
                        one "/" character. The last segment of the URL's path must represent
                        the fully qualified name of the type (as in
                        `path/google.protobuf.Duration`). The name should be in a canonical form
                        (e.g., leading "." is not accepted).

                        In practice, teams usually precompile into the binary all types that they
                        expect it to use in the context of Any. However, for URLs which use the
                        scheme `http`, `https`, or no scheme, one can optionally set up a type
                        server that maps type URLs to message definitions as follows:

                        * If no scheme is provided, `https` is assumed.
                        * An HTTP GET on the URL must yield a [google.protobuf.Type][]
                          value in binary format, or produce an error.
                        * Applications are allowed to cache lookup results based on the
                          URL, or have them precompiled into a binary to avoid any
                          lookup. Therefore, binary compatibility needs to be preserved
                          on changes to types. (Use versioned type names to manage
                          breaking changes.)

                        Note: this functionality is not currently available in the official
                        protobuf release, and it is not used for type URLs beginning with
                        type.googleapis.com. As of May 2023, there are no widely used type server
                        implementations and no plans to implement one.

                        Schemes other than `http`, `https` (or the empty scheme) might be
                        used with implementation specific semantics.
                    type: string
            type: object
        protobufNullValue:
            default: NULL_VALUE
            description: |-
                `NullValue` is a singleton enumeration to represent the null value for the
                `Value` type union.

                The JSON representation for `NullValue` is JSON `null`.

                 - NULL_VALUE: Null value.
            enum:
                - NULL_VALUE
            type: string
        rpcStatus:
            description: |-
                The `Status` type defines a logical error model that is suitable for
                different programming environments, including REST APIs and RPC APIs. It is
                used by [gRPC](https://github.com/grpc). Each `Status` message contains
                three pieces of data: error code, error message, and error details.

                You can find out more about this error model and how to work with it in the
                [API Design Guide](https://cloud.google.com/apis/design/errors).
            properties:
                code:
                    description: |-
                        The status code, which should be an enum value of
                        [google.rpc.Code][google.rpc.Code].
                    format: int32
                    type: integer
                details:
                    description: |-
                        A list of messages that carry the error details.  There is a common set of
                        message types for APIs to use.
                    items:
                        $ref: '#/components/schemas/protobufAny'
                    type: array
                message:
                    description: |-
                        A developer-facing error message, which should be in English. Any
                        user-facing error message should be localized and sent in the
                        [google.rpc.Status.details][google.rpc.Status.details] field, or localized
                        by the client.
                    type: string
            type: object
        v1Address:
            properties:
                address:
                    type: string
                port:
                    format: int64
                    type: integer
            type: object
        v1AttributeContext:
            properties:
                contextExtensions:
                    $ref: '#/components/schemas/v1ContextExtensions'
                destination:
                    $ref: '#/components/schemas/v1Peer'
                metadataContext:
                    additionalProperties:
                        type: string
                    description: Dynamic metadata associated with the request.
                    type: object
                request:
                    $ref: '#/components/schemas/v1Request'
                source:
                    $ref: '#/components/schemas/v1Peer'
            type: object
        v1CheckResponse:
            properties:
                dynamicMetadata:
                    additionalProperties:
                        type: string
                    description: Optional dynamic metadata that will be emitted to the stats sink.
                    type: object
                headersToAdd:
                    additionalProperties:
                        type: string
                    description: Optional response metadata that will be added to the upstream request.
                    type: object
                responseHeadersToAdd:
                    additionalProperties:
                        type: string
                    description: Optional response metadata that will be added to the downstream response.
                    type: object
                status:
                    $ref: '#/components/schemas/rpcStatus'
            type: object
        v1ContextExtensions:
            properties:
                extensions:
                    additionalProperties:
                        type: string
                    description: Additional context information.
                    type: object
            type: object
        v1DeletePermissionsResponse:
            properties:
                success:
                    type: boolean
            type: object
        v1GetPermissionsResponse:
            properties:
                permissions:
                    type: object
                registeredAt:
                    format: date-time
                    type: string
                serviceId:
                    type: string
                serviceName:
                    type: string
                version:
                    type: string
            type: object
        v1ListPermissionsResponse:
            properties:
                nextPageToken:
                    type: string
                permissions:
                    items:
                        $ref: '#/components/schemas/v1GetPermissionsResponse'
                    type: array
            type: object
        v1Peer:
            properties:
                address:
                    $ref: '#/components/schemas/v1Address'
                certificate:
                    additionalProperties:
                        type: string
                    description: The certificate properties.
                    type: object
                labels:
                    additionalProperties:
                        type: string
                    description: The labels associated with the peer.
                    type: object
                principal:
                    description: The authenticated identity of the peer.
                    type: string
                service:
                    description: The canonical service name of the peer.
                    type: string
            type: object
        v1RegisterPermissionsRequest:
            properties:
                permissions:
                    type: object
                serviceId:
                    type: string
                serviceName:
                    type: string
                version:
                    type: string
            type: object
        v1RegisterPermissionsResponse:
            properties:
                id:
                    type: string
                registeredAt:
                    format: date-time
                    type: string
            type: object
        v1Request:
            properties:
                body:
                    description: The HTTP request body.
                    type: string
                headers:
                    additionalProperties:
                        type: string
                    description: The HTTP request headers.
                    type: object
                host:
                    description: The HTTP request host.
                    type: string
                id:
                    description: The HTTP request ID.
                    type: string
                method:
                    description: The HTTP request method.
                    type: string
                path:
                    description: The HTTP request path.
                    type: string
                protocol:
                    description: The HTTP request protocol.
                    type: string
                scheme:
                    description: The HTTP request scheme.
                    type: string
                size:
                    description: The HTTP request size.
                    format: int64
                    type: string
                time:
                    description: The timestamp when the request was received.
                    type: string
            type: object
    securitySchemes:
        OAuth2:
            flows:
                authorizationCode:
                    authorizationUrl: https://auth.canonical.com/oauth/authorize
                    scopes:
                        email: ""
                        openid: ""
                        profile: ""
                    tokenUrl: https://auth.canonical.com/oauth/token
            type: oauth2
externalDocs:
    description: REST API documentation for the Authorization Service
    url: https://github.com/canonical/authorization-service/blob/main/API.md
info:
    contact:
        name: Canonical Authorization Service
        url: https://github.com/canonical/authorization-service
    description: REST API for managing authorization policies and access controls
    license:
        name: AGPL-3.0
        url: https://github.com/canonical/authorization-service/blob/main/LICENSE
    title: Authorization Service API
    version: "1.0"
openapi: 3.0.3
paths:
    /v1/permissions:
        get:
            operationId: ListPermissions
            parameters:
                - in: query
                  name: pageSize
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: pageToken
                  schema:
                    type: string
            responses:
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/rpcStatus'
                    description: An unexpected error response.
            summary: ListPermissions lists all registered permissions
            tags:
                - PermissionsService
        post:
            operationId: RegisterPermissions
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/v1RegisterPermissionsRequest'
                required: true
                x-originalParamName: body
            responses:
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/rpcStatus'
                    description: An unexpected error response.
            summary: RegisterPermissions registers or updates permissions for a service
            tags:
                - PermissionsService
    /v1/permissions/{serviceId}:
        delete:
            operationId: DeletePermissions
            parameters:
                - in: path
                  name: serviceId
                  required: true
                  schema:
                    type: string
            responses:
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/rpcStatus'
                    description: An unexpected error response.
            summary: DeletePermissions removes permissions for a service
            tags:
                - PermissionsService
        get:
            operationId: GetPermissions
            parameters:
                - in: path
                  name: serviceId
                  required: true
                  schema:
                    type: string
                - in: query
                  name: version
                  schema:
                    type: string
            responses:
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/rpcStatus'
                    description: An unexpected error response.
            summary: GetPermissions retrieves permissions for a service
            tags:
                - PermissionsService
tags:
    - name: Authorization
    - name: PermissionsService
