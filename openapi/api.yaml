components:
    schemas:
        protobufAny:
            additionalProperties: {}
            properties:
                '@type':
                    type: string
            type: object
        protobufNullValue:
            default: NULL_VALUE
            description: |-
                `NullValue` is a singleton enumeration to represent the null value for the
                `Value` type union.

                The JSON representation for `NullValue` is JSON `null`.

                 - NULL_VALUE: Null value.
            enum:
                - NULL_VALUE
            type: string
        rpcStatus:
            properties:
                code:
                    format: int32
                    type: integer
                details:
                    items:
                        $ref: '#/components/schemas/protobufAny'
                    type: array
                message:
                    type: string
            type: object
        v1DeletePermissionsResponse:
            properties:
                success:
                    type: boolean
            type: object
        v1GetPermissionsResponse:
            properties:
                permissions:
                    type: object
                registeredAt:
                    format: date-time
                    type: string
                serviceId:
                    type: string
                serviceName:
                    type: string
                version:
                    type: string
            type: object
        v1ListPermissionsResponse:
            properties:
                nextPageToken:
                    type: string
                permissions:
                    items:
                        $ref: '#/components/schemas/v1GetPermissionsResponse'
                    type: array
            type: object
        v1RegisterPermissionsRequest:
            properties:
                permissions:
                    type: object
                serviceId:
                    type: string
                serviceName:
                    type: string
                version:
                    type: string
            type: object
        v1RegisterPermissionsResponse:
            properties:
                id:
                    type: string
                registeredAt:
                    format: date-time
                    type: string
            type: object
    securitySchemes:
        OAuth2:
            flows:
                authorizationCode:
                    authorizationUrl: https://auth.canonical.com/oauth/authorize
                    scopes:
                        email: ""
                        openid: ""
                        profile: ""
                    tokenUrl: https://auth.canonical.com/oauth/token
            type: oauth2
externalDocs:
    description: REST API documentation for the Authorization Service
    url: https://github.com/canonical/authorization-service/blob/main/API.md
info:
    contact:
        name: Canonical Authorization Service
        url: https://github.com/canonical/authorization-service
    description: REST API for managing authorization policies and access controls
    license:
        name: AGPL-3.0
        url: https://github.com/canonical/authorization-service/blob/main/LICENSE
    title: Authorization Service API
    version: "1.0"
openapi: 3.0.3
paths:
    /v1/permissions:
        get:
            operationId: ListPermissions
            parameters:
                - in: query
                  name: pageSize
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: pageToken
                  schema:
                    type: string
            responses:
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/rpcStatus'
                    description: An unexpected error response.
            summary: ListPermissions lists all registered permissions
            tags:
                - PermissionsService
        post:
            operationId: RegisterPermissions
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/v1RegisterPermissionsRequest'
                required: true
                x-originalParamName: body
            responses:
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/rpcStatus'
                    description: An unexpected error response.
            summary: RegisterPermissions registers or updates permissions for a service
            tags:
                - PermissionsService
    /v1/permissions/{serviceId}:
        delete:
            operationId: DeletePermissions
            parameters:
                - in: path
                  name: serviceId
                  required: true
                  schema:
                    type: string
            responses:
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/rpcStatus'
                    description: An unexpected error response.
            summary: DeletePermissions removes permissions for a service
            tags:
                - PermissionsService
        get:
            operationId: GetPermissions
            parameters:
                - in: path
                  name: serviceId
                  required: true
                  schema:
                    type: string
                - in: query
                  name: version
                  schema:
                    type: string
            responses:
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/rpcStatus'
                    description: An unexpected error response.
            summary: GetPermissions retrieves permissions for a service
            tags:
                - PermissionsService
tags:
    - name: PermissionsService
