version: '3.8'

services:
  # OpenFGA - Authorization Engine
  openfga:
    image: openfga/openfga:latest
    container_name: authz-openfga
    ports:
      - "8080:8080"  # HTTP API
      - "8081:8081"  # gRPC API
      - "3000:3000"  # Playground
    command: run
    environment:
      - OPENFGA_DATASTORE_ENGINE=memory
      - OPENFGA_LOG_FORMAT=json
    networks:
      - authz-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NATS with JetStream
  nats:
    image: nats:latest
    container_name: authz-nats
    ports:
      - "4222:4222"  # Client connections
      - "8222:8222"  # HTTP monitoring
      - "6222:6222"  # Cluster connections
    command: ["-js", "-m", "8222"]
    networks:
      - authz-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Valkey (Redis fork)
  valkey:
    image: valkey/valkey:latest
    container_name: authz-valkey
    ports:
      - "6379:6379"
    command: valkey-server --save 60 1 --loglevel warning
    volumes:
      - valkey-data:/data
    networks:
      - authz-network
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NATS monitoring UI (optional)
  nats-box:
    image: natsio/nats-box:latest
    container_name: authz-nats-box
    networks:
      - authz-network
    depends_on:
      - nats
    command: ["tail", "-f", "/dev/null"]

networks:
  authz-network:
    driver: bridge

volumes:
  valkey-data:
